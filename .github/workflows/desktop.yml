# Builds the desktop app's installers and checks that an installed copy
# updates itself. Windows builds first: its update test starts as soon as it
# is built, and the other systems only once it passed. A pushed v* tag also
# publishes them as a GitHub release, with the latest*.yml files installed
# copies update from; running it by hand only leaves them as workflow
# artifacts.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/desktop-build.yml
    with:
      os: windows-latest

  build:
    needs: windows
    strategy:
      # Every build finishes and reports; the release still needs all of them.
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    uses: ./.github/workflows/desktop-build.yml
    with:
      os: ${{ matrix.os }}

  # An installed copy of this build, offered a newer one, has to download it, install it and come back up.
  update-test:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-latest
          path: older
      - name: Build a newer version to update to
        shell: bash
        run: npm version 99.0.0 --no-git-tag-version && npm run desktop
      - name: Install this build and let it update itself
        run: node desktop/update-test.mjs older/aicooldown-windows-x64.exe dist

  release:
    if: github.ref_type == 'tag'
    needs: [windows, build, update-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum aicooldown-* > SHA256SUMS.txt
          cat > notes.md <<'EOF'
          The AI Cooldown dashboard as an app on your own computer, with the **This machine** features the website cannot offer: switch which account the Claude Code and Codex CLIs are logged in with, and say hello on a schedule so a 5-hour window starts before you need it.

          Switched accounts in the Claude app and your chats seem gone? The Claude app keeps a list of Code tab chats per account, all of them still on your computer. **Claude app chats**, under This machine, copies or moves them to the account you use now: a few, or all at once, each as a chat of its own that carries on by itself, with Undo.

          Sign in with your aicooldown.com account to see the same synced accounts as on the website, or stay a guest and keep everything on your computer. Signed in, **Connect this computer** puts it on the Team page with its Claude Code and Codex sessions, the projects they work on and their token usage, and its sessions on the first page under **Your sessions**; the Team page's **Analytics** tab shows how you and your team work with Claude Code and Codex: prompts, lines changed and active time next to sessions and tokens, per day and person, when you work, on what and with which models. You choose there whether sessions may be started or continued on it from the browser, where every conversation opens as a chat with its images, and whether what its sessions say reaches the website (both off until you choose; a team member's computer always shows their team's owner and admins all of their work, while an owner or admin picks what the others see). From the website you can also switch its CLI logins and start a 5-hour window.

          | System | File | |
          | --- | --- | --- |
          | Windows | `aicooldown-windows-x64.exe` | Installer: run it, and AI Cooldown opens and gets a Start menu entry. |
          | macOS, Apple Silicon | `aicooldown-macos-arm64.dmg` | Open it and drag AI Cooldown to Applications. |
          | macOS, Intel | `aicooldown-macos-x64.dmg` | Open it and drag AI Cooldown to Applications. |
          | Linux | `aicooldown-linux-x64.AppImage` | `chmod +x` it, then run it. |

          Closing the window keeps AI Cooldown running in the tray (the Dock on macOS), so scheduled hellos keep going and you get a system notification when a limit resets, crosses 90% or runs out, whichever page the window was left on. The tray icon shows whether each provider has room, and its menu refreshes, adds an account and quits. On Windows the window has its own title bar with the pages and a search for every account and command (**Ctrl+K**), opens where you left it, and has right-click menus, a jump list and keyboard shortcuts (**?** lists them). Everything that can go stale, the Team page, your sessions and a chat's conversation among them, has a refresh button that says when it last read. **Settings** holds startup, what closing the window does, a shortcut that shows it from any app, the theme and which notifications you get. Once installed it also opens at login, straight to the tray; turn that off in Settings or with **Open at login** in the tray icon's menu. Quit from the same menu.

          Installed on Windows or Linux, it keeps itself up to date: a new version downloads in the background and installs the next time the window is closed. On macOS you get a notification when a new version is out.

          The files are not code-signed. On Windows, SmartScreen may say it protected your PC: click **More info**, then **Run anyway**. On macOS, after copying the app to Applications, run `xattr -dr com.apple.quarantine "/Applications/AI Cooldown.app"` once, or allow it in System Settings, Privacy & Security.

          Built by GitHub Actions from this tag's source. `SHA256SUMS.txt` has the checksum of each file. More in the [README](https://github.com/${{ github.repository }}#desktop-app).
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "AI Cooldown $GITHUB_REF_NAME" --notes-file notes.md aicooldown-* latest.yml latest-linux.yml SHA256SUMS.txt
