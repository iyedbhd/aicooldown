# Builds the desktop executables. A pushed v* tag also publishes them as a
# GitHub release; running it by hand only leaves them as workflow artifacts.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commits: whatever runs here ends up inside the executables.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum aicooldown-* > SHA256SUMS.txt
          cat > notes.md <<'EOF'
          The AI Cooldown dashboard as a program for your own computer, with the **This machine** features the website cannot offer: switch which account the Claude Code and Codex CLIs are logged in with, and say hello on a schedule so a 5-hour window starts before you need it.

          Download the file for your system and run it. It opens the dashboard at http://localhost:3477 and keeps running while its window is open.

          | System | File |
          | --- | --- |
          | Windows | `aicooldown-windows-x64.exe` |
          | macOS, Apple Silicon | `aicooldown-macos-arm64` |
          | macOS, Intel | `aicooldown-macos-x64` |
          | Linux | `aicooldown-linux-x64` |

          The files are not code-signed. On Windows, SmartScreen may say it protected your PC: click **More info**, then **Run anyway**. On macOS and Linux, run `chmod +x` on the file first, and on macOS also `xattr -d com.apple.quarantine` on it.

          Built by GitHub Actions from this tag's source. `SHA256SUMS.txt` has the checksum of each file. More in the [README](https://github.com/${{ github.repository }}#desktop-app).
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "AI Cooldown $GITHUB_REF_NAME" --notes-file notes.md aicooldown-* SHA256SUMS.txt
